[project]
name = "smart-todo"
version = "0.1.0"
description = "Smart Todo CLI: a single-user command-line todo manager."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "bandit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", ".harness/tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["smart_todo"]

[tool.coverage.report]
fail_under = 90
show_missing = true
